services:
  order-db:
    image: postgres:16.2
    container_name: fulfillx-order-db
    environment:
      POSTGRES_DB: fulfillx_order
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres

    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data

  customer-db:
    image: postgres:16.2
    container_name: fulfillx-customer-db
    environment:
      POSTGRES_DB: fulfillx_customer
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres

    ports:
      - "5434:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data


  catalog-db:
    image: postgres:16.2
    container_name: fulfillx-catalog-db
    environment:
      POSTGRES_DB: fulfillx_catalog
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres

    ports:
      - "5435:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data

  inventory-db:
    image: postgres:16.2
    container_name: fulfillx-inventory-db
    environment:
      POSTGRES_DB: fulfillx_inventory
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres

    ports:
      - "5436:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data


volumes:
  order-db-data:
  customer-db-data:
  catalog-db-data:
  inventory-db-data: