services:
  order-db:
    image: postgres:16.2
    container_name: fulfillx-order-db
    environment:
      POSTGRES_DB: fulfillx_order
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres

    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data

  customer-db:
    image: postgres:16.2
    container_name: fulfillx-customer-db
    environment:
      POSTGRES_DB: fulfillx_customer
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres

    ports:
      - "5434:5432"
    volumes:
      - customer-db-data:/var/lib/postgresql/data


  catalog-db:
    image: postgres:16.2
    container_name: fulfillx-catalog-db
    environment:
      POSTGRES_DB: fulfillx_catalog
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres

    ports:
      - "5435:5432"
    volumes:
      - catalog-db-data:/var/lib/postgresql/data

  inventory-db:
    image: postgres:16.2
    container_name: fulfillx-inventory-db
    environment:
      POSTGRES_DB: fulfillx_inventory
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres

    ports:
      - "5436:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql/data


  payment-db:
    image: postgres:16.2
    container_name: fulfillx-payment-db
    environment:
      POSTGRES_DB: fulfillx_payment
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres

    ports:
      - "5437:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data

  delivery-db:
    image: postgres:16.2
    container_name: fulfillx-delivery-db
    environment:
      POSTGRES_DB: fulfillx_delivery
      POSTGRES_PASSWORD: root
      POSTGRES_USER: postgres

    ports:
      - "5438:5432"
    volumes:
      - delivery-db-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.1.0
    container_name: fulfillx-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data


volumes:
  order-db-data:
  customer-db-data:
  catalog-db-data:
  inventory-db-data:
  payment-db-data:
  delivery-db-data:
  kafka-data: