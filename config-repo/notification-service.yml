
server:
  port: 8889

spring:
  datasource:
    url: jdbc:postgresql://localhost:5439/fulfillx_notification
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.fulfillx.notification_service.events.NotificationEvent
        spring.json.trusted.packages: com.fulfillx.notification_service.events

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
