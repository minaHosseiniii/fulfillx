server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5433/fulfillx_order
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true

    circuitbreaker:
      resilience4j:
        enableSemaphoreDefaultBulkhead: true
        disable-time-limiter: true
        disable-thread-pool: true


  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
      timeout: 2s

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      group-id: order-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.fulfillx.order.events.messaging
        spring.json.value.default.type: com.fulfillx.order.events.messaging.InventoryReservationResultEvent
        spring.json.use.type.headers: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/fulfillx

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


resilience4j:
  circuitbreaker:
    instances:
      CustomerClientgetCustomerLong:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

      CatalogClientgetProductLong:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents

logging:
  level:
    org.springframework.cache: TRACE
    org.springframework.data.redis.cache: TRACE