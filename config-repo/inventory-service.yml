
server:
  port: 8887

spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/fulfillx_inventory
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true


  kafka:
    consumer:
      group-id: inventory-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.fulfillx.inventory_service.events.messaging
        spring.json.value.default.type: com.fulfillx.inventory_service.events.messaging.ReserveInventoryCommand
        spring.json.use.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
