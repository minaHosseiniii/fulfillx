
server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/fulfillx_customer
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/fulfillx

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka